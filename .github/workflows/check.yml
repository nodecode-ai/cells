name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nodecode
        # preview.nodecode.ai refuses datacenter networks, GitHub's included; a
        # Cloudflare rule lets through a request carrying this repository's
        # key. curl reads ~/.curlrc, so the installer's own downloads carry it
        # too. Downloaded first, so a refused download fails the step instead
        # of piping nothing into sh; the headers say who refused it.
        env:
          NODECODE_CI_KEY: ${{ secrets.NODECODE_CI_KEY }}
        run: |
          printf 'header = "X-Nodecode-CI: %s"\n' "$NODECODE_CI_KEY" > ~/.curlrc
          curl -fsSL -o "$RUNNER_TEMP/install.sh" https://preview.nodecode.ai/install.sh \
            || { curl -sI https://preview.nodecode.ai/install.sh; exit 1; }
          sh "$RUNNER_TEMP/install.sh"
          rm ~/.curlrc
      - name: Install and load every entry
        run: tools/check.sh "$HOME/.local/bin/nodecode"
