name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nodecode
        # Downloaded first, so a refused download fails the step instead of
        # piping nothing into sh; the headers say who refused it.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/install.sh" https://preview.nodecode.ai/install.sh \
            || { curl -sI https://preview.nodecode.ai/install.sh; exit 1; }
          sh "$RUNNER_TEMP/install.sh"
      - name: Install and load every entry
        run: tools/check.sh "$HOME/.local/bin/nodecode"
