name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nodecode
        # preview.nodecode.ai refuses datacenter networks, GitHub's included; a
        # Cloudflare rule lets through a request carrying this repository's
        # key. curl reads ~/.curlrc, so the installer's own downloads carry it
        # too. Downloaded first, so a refused download fails the step instead
        # of piping nothing into sh; the headers say who refused it.
        env:
          NODECODE_CI_KEY: ${{ secrets.NODECODE_CI_KEY }}
        run: |
          printf 'header = "X-Nodecode-CI: %s"\n' "$NODECODE_CI_KEY" > ~/.curlrc
          curl -fsSL -o "$RUNNER_TEMP/install.sh" https://preview.nodecode.ai/install.sh \
            || { curl -sI https://preview.nodecode.ai/install.sh; exit 1; }
          sh "$RUNNER_TEMP/install.sh"
          rm ~/.curlrc
      - name: Reach the private entries
        # Each private entry's repository carries a read-only deploy key, its
        # private half the secret DEPLOY_KEY_<NAME>, named here one by one: a
        # new private entry adds its line. Only this step sees the keys; the
        # check after it runs add-on code. Pull requests from forks get no
        # secrets, so a private entry cannot be cloned there.
        env:
          DEPLOY_KEY_ADDONS: ${{ secrets.DEPLOY_KEY_ADDONS }}
        run: .github/deploy-keys.sh
      - name: Install and load every entry
        run: .github/check.sh "$HOME/.local/bin/nodecode"

  lint:
    # Nodecode's own structural lint over every Lisp file here, read from
    # Nodecode main, so a cell is held to the rules the core is held to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends sbcl
      - name: Lint every Lisp file
        run: .github/lint.sh
